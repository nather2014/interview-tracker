services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: interviews
      POSTGRES_USER: interviews
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-interviews}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - interviews-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviews"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  interviews-db:
